server:
  port: 8080  # порт для REST API мониторинга

notification:
  socket:
    port: 1111
    bind-address: localhost # слушаем все интерфейсы
    allowed-ip: 91.222.167.188       # Контроллер в локальной сети

    # Лимиты
    max-connections: 2
    connection-timeout-ms: 30000

    # Защита от атак
    max-message-size: 1024   # Макс размер сообщения
    rate-limit-per-ip: 2    # Сообщений в секунду
logger:
  config: ./logback-spring.xml